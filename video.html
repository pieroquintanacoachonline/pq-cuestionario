<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PQ Coach Online • Visor de Ejercicio</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --pq-blue: #002875;
      --pq-blue-light: #003BB4;
      --pq-electric: #2563EB;
      --pq-cyan: #00F0FF;
      --pq-gold: #F59E0B;
      --pq-emerald: #10B981;
      --bg-dark: #070B14;
      --card-bg: rgba(15, 23, 42, 0.94);
      --card-border: rgba(59, 130, 246, 0.22);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18), transparent 50%),
        radial-gradient(circle at 10% 100%, rgba(0, 40, 117, 0.22), transparent 45%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 30px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .badges-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 9999px;
      font-family: 'Archivo', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .badge-muscle {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--pq-cyan);
    }

    .badge-ss {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: var(--pq-gold);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    /* EXERCISE TITLE CARD */
    .title-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .exercise-title {
      font-family: 'Archivo', sans-serif;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.25;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .meta-pill strong {
      color: #FFFFFF;
      font-weight: 700;
    }

    .meta-pill.unilateral {
      background: rgba(0, 240, 255, 0.1);
      border-color: rgba(0, 240, 255, 0.35);
      color: var(--pq-cyan);
    }

    .meta-pill.unilateral strong {
      color: var(--pq-cyan);
    }

    /* VIDEO PLAYER CARD */
    .video-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
    }

    .video-element, .video-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      background: #000000;
    }

    .video-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #000000;
      color: var(--text-muted);
      font-size: 13px;
      z-index: 2;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: var(--pq-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* CARDS CONTAINER */
    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* TUS APUNTES CARD */
    .notes-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 8px 24px -6px rgba(0, 240, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .notes-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--pq-cyan), var(--pq-electric));
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-icon {
      font-size: 18px;
      line-height: 1;
    }

    .card-title {
      font-family: 'Archivo', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .notes-title {
      color: var(--pq-cyan);
    }

    .notes-content {
      font-size: 15px;
      line-height: 1.5;
      color: #FFFFFF;
      font-weight: 600;
    }

    /* CLAVES TECNICAS CARD */
    .cues-card {
      background: linear-gradient(145deg, rgba(20, 28, 48, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px -6px rgba(245, 158, 11, 0.12);
      position: relative;
      overflow: hidden;
    }

    .cues-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--pq-gold), #EF4444);
    }

    .cues-title {
      color: var(--pq-gold);
    }

    .cues-content {
      font-size: 14.5px;
      line-height: 1.6;
      color: #E2E8F0;
      font-weight: 400;
    }

    /* BOTON VOLVER */
    .actions-box {
      margin-top: 4px;
    }

    .btn-return {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-decoration: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
    }

    .btn-return:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header class="header">
      <a href="#" class="logo-box">
        <img src="logo.png" alt="PQ Coach" class="logo-img" onerror="this.style.display='none'">
      </a>
      <div class="badges-group">
        <div class="badge badge-ss" id="ssBadge" style="display: none;">
          <span>⚡</span>
          <span>SUPERSERIE</span>
        </div>
        <div class="badge badge-muscle" id="muscleBadge">
          <span class="badge-dot"></span>
          <span id="muscleText">EJERCICIO</span>
        </div>
      </div>
    </header>

    <!-- TITLE CARD -->
    <div class="title-card">
      <h1 class="exercise-title" id="exerciseName">Cargando ejercicio...</h1>
      <div class="meta-row" id="metaRow">
        <span class="meta-pill" id="repsTag" style="display: none;">🎯 <strong id="repsText">-</strong></span>
        <span class="meta-pill" id="descTag" style="display: none;">⏱️ <strong id="descText">-</strong></span>
      </div>
    </div>

    <!-- VIDEO CARD -->
    <div class="video-card">
      <div class="video-wrapper">
        <div class="video-loading" id="videoLoading">
          <div class="spinner"></div>
          <span>Cargando demostración...</span>
        </div>

        <!-- Video Player Nativo HTML5 -->
        <video 
          id="nativePlayer" 
          class="video-element" 
          controls 
          playsinline 
          webkit-playsinline 
          preload="auto"
          style="display: none;">
        </video>

        <!-- Fallback Iframe -->
        <iframe 
          id="previewFrame" 
          class="video-frame" 
          allow="autoplay; fullscreen"
          style="display: none;">
        </iframe>
      </div>
    </div>

    <!-- CARDS CONTAINER (NOTAS + CLAVES) -->
    <div class="info-grid">

      <!-- TUS APUNTES / AJUSTES DE MAQUINA (COL C) -->
      <div class="notes-card" id="notesCard" style="display: none;">
        <div class="card-header">
          <span class="card-icon">📝</span>
          <span class="card-title notes-title">Tus Apuntes / Ajustes de Máquina</span>
        </div>
        <div class="notes-content" id="notesText"></div>
      </div>

      <!-- CLAVES TECNICAS DE EJECUCION (COL E) -->
      <div class="cues-card" id="cuesCard">
        <div class="card-header">
          <span class="card-icon">💡</span>
          <span class="card-title cues-title">Claves Técnicas de Ejecución</span>
        </div>
        <div class="cues-content" id="cuesText">
          Cargando indicaciones técnicas del coach...
        </div>
      </div>

    </div>

    <!-- BOTON VOLVER -->
    <div class="actions-box">
      <button class="btn-return" onclick="handleReturn()">
        ← Volver a mi entrenamiento
      </button>
    </div>

    <footer class="footer">
      PQ COACH ONLINE • HIPERTROFIA & COMPOSICIÓN CORPORAL
    </footer>

  </div>

  <script>
    let dbData = null;
    let currentId = '';

    // Obtener parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const paramId = urlParams.get('id') || '';
    const paramNombre = urlParams.get('nombre') || '';
    const paramReps = urlParams.get('reps') || '';
    const paramDesc = urlParams.get('desc') || '';
    const paramClaves = urlParams.get('claves') || '';
    const paramNotas = urlParams.get('notas') || '';
    const paramGrupo = urlParams.get('grupo') || '';

    // Normalizar ID de archivo por si viene URL completa
    currentId = paramId;
    if (currentId.includes('/d/')) {
      const match = currentId.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match) currentId = match[1];
    }

    async function init() {
      // 1. Renderizar inmediato lo que viene en URL (personalizado del atleta)
      if (paramNombre) {
        document.getElementById('exerciseName').textContent = paramNombre;
        document.title = `${paramNombre} • PQ Coach`;
      }
      if (paramGrupo) {
        document.getElementById('muscleText').textContent = paramGrupo;
      }
      if (paramClaves) {
        document.getElementById('cuesText').textContent = paramClaves;
      }

      // Procesar Notas / Apuntes personales de máquina (Columna C)
      if (paramNotas && paramNotas.trim() !== '') {
        document.getElementById('notesText').textContent = paramNotas.trim();
        document.getElementById('notesCard').style.display = 'block';
      }

      // Detección inteligente de Superserie (en notas o nombre)
      const fullText = `${paramNombre} ${paramNotas}`.toLowerCase();
      if (fullText.includes('ss') || fullText.includes('superserie') || fullText.includes('super serie') || fullText.includes('a1') || fullText.includes('a2')) {
        document.getElementById('ssBadge').style.display = 'inline-flex';
      }

      // Formatear Reps (con prioridad manual y soporte unilateral)
      formatReps(paramReps);

      // Formatear Descanso (con prioridad manual y soporte unilateral 1/2)
      formatDesc(paramDesc);

      // 2. Cargar ejercicios.json para autocompletar si falta grupo muscular o claves
      try {
        const resp = await fetch('ejercicios.json');
        if (resp.ok) {
          dbData = await resp.json();
          completeFromDatabase();
        }
      } catch (err) {
        console.warn('Usando parámetros de URL directos:', err);
      }

      // 3. Montar video
      setupVideo(currentId);
    }

    function formatReps(val) {
      if (!val || val.trim() === '') return;
      const clean = val.trim();
      const repsTag = document.getElementById('repsTag');
      const repsText = document.getElementById('repsText');

      // Si es formato unilateral (ej: "1/10", "1/12", "1/10-12")
      if (clean.startsWith('1/') || clean.toLowerCase().includes('1 por lado')) {
        const part = clean.replace(/^1\//, '').trim();
        repsTag.className = 'meta-pill unilateral';
        repsText.innerHTML = `<strong>1 por lado</strong> x ${part} reps`;
        repsTag.style.display = 'inline-flex';
      } else {
        repsTag.className = 'meta-pill';
        const suffix = clean.toLowerCase().includes('rep') ? '' : ' reps';
        repsText.innerHTML = `<strong>${clean}</strong>${suffix}`;
        repsTag.style.display = 'inline-flex';
      }
    }

    function formatDesc(val) {
      if (!val || val.trim() === '') return;
      const clean = val.trim();
      const descTag = document.getElementById('descTag');
      const descText = document.getElementById('descText');

      // Si es descanso unilateral (ej: "1/2" -> 1 min entre lados / 2 min entre series)
      if (clean.includes('/')) {
        const parts = clean.split('/');
        let entreLados = parts[0].trim();
        let entreSeries = parts[1].trim();

        if (/^\d+(\.\d+)?$/.test(entreLados)) entreLados += ' min';
        if (/^\d+(\.\d+)?$/.test(entreSeries)) entreSeries += ' min';

        descTag.className = 'meta-pill unilateral';
        descText.innerHTML = `<strong>${entreLados}</strong> e/lados • <strong>${entreSeries}</strong> e/series`;
        descTag.style.display = 'inline-flex';
      } else if (/^\d+(\.\d+)?$/.test(clean)) {
        // Si el coach escribió solo un número (ej: "2", "3", "1.5")
        descTag.className = 'meta-pill';
        descText.innerHTML = `<strong>${clean} min</strong>`;
        descTag.style.display = 'inline-flex';
      } else {
        // Texto libre (ej: "90s", "1-2 min")
        descTag.className = 'meta-pill';
        descText.innerHTML = `<strong>${clean}</strong>`;
        descTag.style.display = 'inline-flex';
      }
    }

    function completeFromDatabase() {
      if (!dbData) return;
      
      let ex = null;
      if (currentId && dbData.by_id && dbData.by_id[currentId]) {
        ex = dbData.by_id[currentId];
      } else if (paramNombre && dbData.by_name) {
        const norm = paramNombre.toLowerCase().replace(/[^a-zA-Z0-9]/g, '');
        ex = dbData.by_name[norm];
        if (ex && ex.id && !currentId) {
          currentId = ex.id;
        }
      }

      if (ex) {
        if (!paramNombre) {
          document.getElementById('exerciseName').textContent = ex.nombre;
          document.title = `${ex.nombre} • PQ Coach`;
        }
        if (!paramGrupo && ex.grupo) {
          document.getElementById('muscleText').textContent = ex.grupo;
        }
        // Solo usar claves de BD si en la fila de la hoja vinieron vacías
        if (!paramClaves && ex.claves) {
          document.getElementById('cuesText').textContent = ex.claves;
        }
        // Solo usar reps/desc de BD si en la fila vinieron vacíos
        if (!paramReps && ex.reps) {
          formatReps(ex.reps);
        }
        if (!paramDesc && ex.desc) {
          formatDesc(ex.desc);
        }
      }
    }

    function setupVideo(fileId) {
      if (!fileId) {
        document.getElementById('videoLoading').innerHTML = '<span>⚠️ No se especificó el ID del video.</span>';
        return;
      }

      const nativePlayer = document.getElementById('nativePlayer');
      const previewFrame = document.getElementById('previewFrame');
      const loading = document.getElementById('videoLoading');

      const streamUrl = `https://drive.usercontent.google.com/download?id=${fileId}&export=download`;
      nativePlayer.src = streamUrl;
      nativePlayer.style.display = 'block';

      nativePlayer.onloadeddata = () => {
        loading.style.display = 'none';
      };

      nativePlayer.onerror = () => {
        // Fallback silencioso a iframe si falla el stream directo
        nativePlayer.style.display = 'none';
        previewFrame.src = `https://drive.google.com/file/d/${fileId}/preview`;
        previewFrame.style.display = 'block';
        previewFrame.onload = () => {
          loading.style.display = 'none';
        };
      };

      setTimeout(() => {
        loading.style.display = 'none';
      }, 3500);
    }

    function handleReturn() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
