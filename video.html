<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PQ Coach Online • Visor de Ejercicio</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --pq-blue: #002875;
      --pq-blue-light: #003BB4;
      --pq-electric: #2563EB;
      --pq-cyan: #00F0FF;
      --pq-gold: #F59E0B;
      --pq-emerald: #10B981;
      --bg-dark: #080D1A;
      --card-bg: rgba(15, 23, 42, 0.92);
      --card-border: rgba(59, 130, 246, 0.25);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15), transparent 45%),
        radial-gradient(circle at 10% 100%, rgba(0, 40, 117, 0.2), transparent 40%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 40px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .badge-muscle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--pq-cyan);
      font-family: 'Archivo', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pq-cyan);
      box-shadow: 0 0 8px var(--pq-cyan);
    }

    /* EXERCISE TITLE CARD */
    .title-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .exercise-title {
      font-family: 'Archivo', sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .meta-tag strong {
      color: #FFFFFF;
    }

    /* VIDEO PLAYER CARD */
    .video-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
    }

    .video-element, .video-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      background: #000000;
    }

    .video-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #000000;
      color: var(--text-muted);
      font-size: 13px;
      z-index: 2;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: var(--pq-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* CLAVES TECNICAS CARD */
    .cues-card {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.7));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 10px 25px -8px rgba(245, 158, 11, 0.15);
      position: relative;
      overflow: hidden;
    }

    .cues-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--pq-gold), var(--pq-cyan));
    }

    .cues-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cues-icon {
      font-size: 20px;
      line-height: 1;
    }

    .cues-title {
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--pq-gold);
      text-transform: uppercase;
    }

    .cues-content {
      font-size: 14.5px;
      line-height: 1.6;
      color: #E2E8F0;
      font-weight: 400;
    }

    /* ACTION BUTTONS */
    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 14px;
      font-family: 'Archivo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-drive {
      background: rgba(37, 99, 235, 0.15);
      color: #60A5FA;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .btn-drive:active {
      transform: scale(0.98);
      background: rgba(37, 99, 235, 0.25);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header class="header">
      <a href="#" class="logo-box">
        <img src="logo.png" alt="PQ Coach" class="logo-img" onerror="this.style.display='none'">
      </a>
      <div class="badge-muscle" id="muscleBadge">
        <span class="badge-dot"></span>
        <span id="muscleText">EJERCICIO</span>
      </div>
    </header>

    <!-- TITLE CARD -->
    <div class="title-card">
      <h1 class="exercise-title" id="exerciseName">Cargando ejercicio...</h1>
      <div class="meta-row" id="metaRow">
        <span class="meta-tag" id="repsTag" style="display: none;">🎯 Reps: <strong id="repsText">-</strong></span>
        <span class="meta-tag" id="descTag" style="display: none;">⏱️ Descanso: <strong id="descText">-</strong></span>
        <span class="meta-tag" id="secTag" style="display: none;">🔗 Sinergista: <strong id="secText">-</strong></span>
      </div>
    </div>

    <!-- VIDEO CARD -->
    <div class="video-card">
      <div class="video-wrapper">
        <div class="video-loading" id="videoLoading">
          <div class="spinner"></div>
          <span>Cargando demostración...</span>
        </div>

        <!-- Video Player Nativo HTML5 -->
        <video 
          id="nativePlayer" 
          class="video-element" 
          controls 
          playsinline 
          webkit-playsinline 
          preload="auto"
          style="display: none;">
        </video>

        <!-- Fallback Iframe (Preview) -->
        <iframe 
          id="previewFrame" 
          class="video-frame" 
          allow="autoplay; fullscreen"
          style="display: none;">
        </iframe>
      </div>
    </div>

    <!-- CLAVES TECNICAS CARD -->
    <div class="cues-card" id="cuesCard">
      <div class="cues-header">
        <span class="cues-icon">💡</span>
        <span class="cues-title">Claves Técnicas de Ejecución</span>
      </div>
      <div class="cues-content" id="cuesText">
        Cargando indicaciones técnicas del coach...
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions-row">
      <button class="btn btn-secondary" onclick="togglePlayerMode()" id="btnToggle">
        🔁 Alternar Reproductor
      </button>
      <a href="#" target="_blank" class="btn btn-drive" id="btnDrive">
        ↗️ Abrir en Drive
      </a>
    </div>

    <footer class="footer">
      PQ COACH ONLINE • ALTO RENDIMIENTO & HIPERTROFIA
    </footer>

  </div>

  <script>
    let dbData = null;
    let currentId = '';
    let isIframeMode = false;

    // Obtener parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const paramId = urlParams.get('id') || '';
    const paramNombre = urlParams.get('nombre') || '';
    const paramClaves = urlParams.get('claves') || '';
    const paramGrupo = urlParams.get('grupo') || '';

    currentId = paramId;

    // Inicializar carga de base de datos
    async function init() {
      // 1. Mostrar lo que vino en URL de inmediato si existe
      if (paramNombre) {
        document.getElementById('exerciseName').textContent = paramNombre;
        document.title = `${paramNombre} • PQ Coach`;
      }
      if (paramGrupo) {
        document.getElementById('muscleText').textContent = paramGrupo;
      }
      if (paramClaves) {
        document.getElementById('cuesText').textContent = paramClaves;
      }

      // 2. Cargar ejercicios.json
      try {
        const resp = await fetch('ejercicios.json');
        if (resp.ok) {
          dbData = await resp.json();
          lookupExercise();
        }
      } catch (err) {
        console.warn('No se pudo cargar ejercicios.json local, usando parámetros de URL:', err);
      }

      // 3. Montar video
      setupVideo(currentId);
    }

    function lookupExercise() {
      if (!dbData) return;
      
      let ex = null;
      if (currentId && dbData.by_id && dbData.by_id[currentId]) {
        ex = dbData.by_id[currentId];
      } else if (paramNombre && dbData.by_name) {
        const norm = paramNombre.toLowerCase().replace(/[^a-zA-Z0-9]/g, '');
        ex = dbData.by_name[norm];
        if (ex && ex.id && !currentId) {
          currentId = ex.id;
        }
      }

      if (ex) {
        document.getElementById('exerciseName').textContent = ex.nombre;
        document.title = `${ex.nombre} • PQ Coach`;
        
        if (ex.grupo) {
          document.getElementById('muscleText').textContent = ex.grupo;
        }
        if (ex.claves) {
          document.getElementById('cuesText').textContent = ex.claves;
        } else {
          document.getElementById('cuesText').textContent = 'Sigue las pautas de cadencia, rango de recorrido y RIR indicadas por tu coach.';
        }

        // Metas
        if (ex.reps) {
          document.getElementById('repsText').textContent = ex.reps;
          document.getElementById('repsTag').style.display = 'inline-flex';
        }
        if (ex.desc) {
          document.getElementById('descText').textContent = ex.desc;
          document.getElementById('descTag').style.display = 'inline-flex';
        }
        if (ex.secundario) {
          document.getElementById('secText').textContent = ex.secundario;
          document.getElementById('secTag').style.display = 'inline-flex';
        }
      }
    }

    function setupVideo(fileId) {
      if (!fileId) {
        document.getElementById('videoLoading').innerHTML = '<span>⚠️ No se especificó el ID del video.</span>';
        return;
      }

      const nativePlayer = document.getElementById('nativePlayer');
      const previewFrame = document.getElementById('previewFrame');
      const loading = document.getElementById('videoLoading');
      const btnDrive = document.getElementById('btnDrive');

      // Botón enlace a Drive
      btnDrive.href = `https://drive.google.com/file/d/${fileId}/view`;

      // Intentar primero con el reproductor HTML5 nativo usando stream directo
      const streamUrl = `https://drive.usercontent.google.com/download?id=${fileId}&export=download`;
      nativePlayer.src = streamUrl;
      nativePlayer.style.display = 'block';

      nativePlayer.onloadeddata = () => {
        loading.style.display = 'none';
      };

      nativePlayer.onerror = () => {
        console.warn('Error en reproductor nativo, alternando a Iframe Preview...');
        switchToIframe(fileId);
      };

      // Si después de 4 segundos no carga el nativo, preparar opción de iframe
      setTimeout(() => {
        if (nativePlayer.readyState < 2 && !isIframeMode) {
          console.log('Stream nativo tomando tiempo, manteniendo controles...');
          loading.style.display = 'none';
        }
      }, 3500);
    }

    function switchToIframe(fileId) {
      isIframeMode = true;
      const nativePlayer = document.getElementById('nativePlayer');
      const previewFrame = document.getElementById('previewFrame');
      const loading = document.getElementById('videoLoading');

      nativePlayer.pause();
      nativePlayer.style.display = 'none';

      previewFrame.src = `https://drive.google.com/file/d/${fileId}/preview`;
      previewFrame.style.display = 'block';
      previewFrame.onload = () => {
        loading.style.display = 'none';
      };
    }

    function togglePlayerMode() {
      if (isIframeMode) {
        // Volver a nativo
        isIframeMode = false;
        document.getElementById('previewFrame').style.display = 'none';
        const native = document.getElementById('nativePlayer');
        native.style.display = 'block';
        native.play().catch(() => {});
      } else {
        switchToIframe(currentId);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
