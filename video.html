<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PQ Coach Online • Visor de Ejercicio</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --pq-blue: #002875;
      --pq-blue-light: #003BB4;
      --pq-electric: #2563EB;
      --pq-cyan: #00F0FF;
      --pq-gold: #F59E0B;
      --bg-dark: #070B14;
      --card-bg: rgba(15, 23, 42, 0.94);
      --card-border: rgba(59, 130, 246, 0.22);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18), transparent 50%),
        radial-gradient(circle at 10% 100%, rgba(0, 40, 117, 0.22), transparent 45%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 30px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .badge-muscle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--pq-cyan);
      font-family: 'Archivo', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pq-cyan);
      box-shadow: 0 0 6px var(--pq-cyan);
    }

    /* EXERCISE TITLE CARD */
    .title-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .exercise-title {
      font-family: 'Archivo', sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }

    /* VIDEO PLAYER CARD - ADAPTABLE Y ENCUADRADO */
    .video-card {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.85);
      position: relative;
      width: 100%;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 240px;
    }

    .video-element {
      width: 100%;
      height: auto;
      max-height: 65vh;
      display: block;
      object-fit: contain;
      background: #000000;
      border-radius: 16px;
    }

    .video-frame {
      width: 100%;
      min-height: 380px;
      height: 52vh;
      border: none;
      object-fit: contain;
      background: #000000;
      display: block;
    }

    .video-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #000000;
      color: var(--text-muted);
      font-size: 13px;
      z-index: 2;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: var(--pq-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* CLAVES TECNICAS CARD */
    .cues-card {
      background: linear-gradient(145deg, rgba(20, 28, 48, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px -6px rgba(245, 158, 11, 0.12);
      position: relative;
      overflow: hidden;
    }

    .cues-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--pq-gold), #EF4444);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-icon {
      font-size: 18px;
      line-height: 1;
    }

    .card-title {
      font-family: 'Archivo', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--pq-gold);
    }

    .cues-content {
      font-size: 14.5px;
      line-height: 1.6;
      color: #E2E8F0;
      font-weight: 400;
    }

    /* BOTON VOLVER */
    .actions-box {
      margin-top: 4px;
    }

    .btn-return {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-decoration: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
    }

    .btn-return:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header class="header">
      <a href="#" class="logo-box">
        <img src="logo.png" alt="PQ Coach" class="logo-img" onerror="this.style.display='none'">
      </a>
      <div class="badge-muscle" id="muscleBadge">
        <span class="badge-dot"></span>
        <span id="muscleText">EJERCICIO</span>
      </div>
    </header>

    <!-- TITLE CARD -->
    <div class="title-card">
      <h1 class="exercise-title" id="exerciseName">Cargando ejercicio...</h1>
    </div>

    <!-- VIDEO CARD -->
    <div class="video-card">
      <div class="video-wrapper">
        <div class="video-loading" id="videoLoading">
          <div class="spinner"></div>
          <span>Cargando demostración...</span>
        </div>

        <!-- Video Player Nativo HTML5 -->
        <video 
          id="nativePlayer" 
          class="video-element" 
          controls 
          playsinline 
          webkit-playsinline 
          preload="metadata"
          style="display: none;">
        </video>

        <!-- Fallback Iframe -->
        <iframe 
          id="previewFrame" 
          class="video-frame" 
          allow="autoplay; fullscreen"
          style="display: none;">
        </iframe>
      </div>
    </div>

    <!-- CLAVES TECNICAS DE EJECUCION -->
    <div class="cues-card" id="cuesCard">
      <div class="card-header">
        <span class="card-icon">💡</span>
        <span class="card-title">Claves Técnicas de Ejecución</span>
      </div>
      <div class="cues-content" id="cuesText">
        Cargando indicaciones técnicas del coach...
      </div>
    </div>

    <!-- BOTON VOLVER -->
    <div class="actions-box">
      <button class="btn-return" onclick="handleReturn()">
        ← Volver a mi entrenamiento
      </button>
    </div>

    <footer class="footer">
      PQ COACH ONLINE • HIPERTROFIA & COMPOSICIÓN CORPORAL
    </footer>

  </div>

  <script>
    let dbData = null;
    let currentId = '';

    // Obtener parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const paramId = urlParams.get('id') || '';
    const paramNombre = urlParams.get('nombre') || '';
    const paramClaves = urlParams.get('claves') || '';
    const paramGrupo = urlParams.get('grupo') || '';

    // Normalizar ID de archivo por si viene URL completa
    currentId = paramId;
    if (currentId.includes('/d/')) {
      const match = currentId.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match) currentId = match[1];
    }

    async function init() {
      // 1. Mostrar lo que viene en URL de inmediato
      if (paramNombre) {
        document.getElementById('exerciseName').textContent = paramNombre;
        document.title = `${paramNombre} • PQ Coach`;
      }
      if (paramGrupo) {
        document.getElementById('muscleText').textContent = paramGrupo;
      }
      if (paramClaves) {
        document.getElementById('cuesText').textContent = paramClaves;
      }

      // 2. Cargar ejercicios.json para autocompletar si falta grupo muscular o claves
      try {
        const resp = await fetch('ejercicios.json');
        if (resp.ok) {
          dbData = await resp.json();
          completeFromDatabase();
        }
      } catch (err) {
        console.warn('Usando parámetros de URL directos:', err);
      }

      // 3. Montar video optimizado
      setupVideo(currentId);
    }

    function completeFromDatabase() {
      if (!dbData) return;
      
      let ex = null;
      if (currentId && dbData.by_id && dbData.by_id[currentId]) {
        ex = dbData.by_id[currentId];
      } else if (paramNombre && dbData.by_name) {
        const norm = paramNombre.toLowerCase().replace(/[^a-zA-Z0-9]/g, '');
        ex = dbData.by_name[norm];
        if (ex && ex.id && !currentId) {
          currentId = ex.id;
        }
      }

      if (ex) {
        if (!paramNombre) {
          document.getElementById('exerciseName').textContent = ex.nombre;
          document.title = `${ex.nombre} • PQ Coach`;
        }
        if (!paramGrupo && ex.grupo) {
          document.getElementById('muscleText').textContent = ex.grupo;
        }
        // Solo usar claves de BD si en la fila de la hoja vinieron vacías
        if (!paramClaves && ex.claves) {
          document.getElementById('cuesText').textContent = ex.claves;
        }
      }
    }

    function setupVideo(fileId) {
      if (!fileId) {
        document.getElementById('videoLoading').innerHTML = '<span>⚠️ No se especificó el ID del video.</span>';
        return;
      }

      const nativePlayer = document.getElementById('nativePlayer');
      const previewFrame = document.getElementById('previewFrame');
      const loading = document.getElementById('videoLoading');

      // Intentar primero con el endpoint stream directo de Cloudflare (/stream?id=...)
      // Esto elimina el Content-Disposition: attachment para que iPhone Safari lo reproduzca nativo
      const streamUrl = `/stream?id=${fileId}`;
      nativePlayer.src = streamUrl;
      nativePlayer.style.display = 'block';

      nativePlayer.onloadedmetadata = () => {
        loading.style.display = 'none';
      };

      nativePlayer.onloadeddata = () => {
        loading.style.display = 'none';
      };

      nativePlayer.onplay = () => {
        loading.style.display = 'none';
      };

      // Fallback si el worker aún no está activo o falla
      nativePlayer.onerror = () => {
        console.warn('Fallo en /stream nativo, usando Google Drive Preview encuadrado');
        nativePlayer.style.display = 'none';
        previewFrame.src = `https://drive.google.com/file/d/${fileId}/preview`;
        previewFrame.style.display = 'block';
        previewFrame.onload = () => {
          loading.style.display = 'none';
        };
      };

      setTimeout(() => {
        loading.style.display = 'none';
      }, 3500);
    }

    function handleReturn() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
