<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#070b18"/></linearGradient></defs>
<rect width="1000" height="800" rx="26" fill="url(#bg)"/>
<text x="500" y="62" text-anchor="middle" font-size="44" font-weight="800" fill="#ffffff">Toma de fotos</text>
<text x="500" y="92" text-anchor="middle" font-size="18" fill="#93c5fd">para evaluar tu progreso de composición corporal</text>

<!-- Cómo colocarte -->
<rect x="40" y="130" width="420" height="300" rx="22" fill="#111c3a" stroke="#1e3a8a" stroke-width="2"/>
<text x="60" y="166" font-size="18" font-weight="700" fill="#ffffff">Colócate así y haz las 4 fotos</text>
<text x="60" y="190" font-size="15" fill="#cbd5e1">con ayuda de alguien o de un soporte o trípode.</text>
<line x1="60" y1="395" x2="440" y2="395" stroke="#475569" stroke-width="3"/>
<!-- trípode + celular a 100 cm -->
<rect x="102" y="285" width="8" height="110" fill="#64748b"/>
<rect x="90" y="262" width="32" height="46" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
<line x1="106" y1="395" x2="86" y2="395" stroke="#64748b" stroke-width="4"/><line x1="106" y1="395" x2="128" y2="395" stroke="#64748b" stroke-width="4"/>
<line x1="150" y1="285" x2="150" y2="395" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"/>
<text x="158" y="345" font-size="15" fill="#22d3ee" font-weight="700">100 cm</text>
<line x1="124" y1="285" x2="372" y2="285" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="168" y="276" font-size="15" fill="#fbbf24" font-weight="700">150 cm</text>
<g transform="translate(405,262) scale(0.55) translate(-405,-262)"><line x1="394" y1="374" x2="392" y2="488" stroke="#cbd5e1" stroke-width="20" stroke-linecap="round"/><line x1="416" y1="374" x2="418" y2="488" stroke="#cbd5e1" stroke-width="20" stroke-linecap="round"/><path d="M374 306 Q405 298 436 306 L428 378 L382 378 Z" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="6" stroke-linejoin="round"/><line x1="369" y1="314" x2="357" y2="384" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/><line x1="441" y1="314" x2="453" y2="384" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/><circle cx="405" cy="278" r="15" fill="#cbd5e1"/><line x1="405" y1="290" x2="405" y2="302" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><path d="M380 374 L430 374 L432 398 L408 400 L405 386 L402 400 L378 398 Z" fill="#2563eb"/></g>
<text x="60" y="424" font-size="14" fill="#fbbf24">⚠ Que los brazos no salgan cortados en la foto.</text>

<!-- Qué vestir -->
<rect x="40" y="450" width="420" height="320" rx="22" fill="#111c3a" stroke="#1e3a8a" stroke-width="2"/>
<text x="60" y="488" font-size="26" font-weight="800" fill="#ffffff">No olvides vestir</text>
<text x="60" y="516" font-size="20" font-weight="700" fill="#22d3ee">una prenda ligera</text>
<text x="60" y="566" font-size="17" font-weight="700" fill="#ffffff">Mujer</text>
<text x="60" y="590" font-size="15" fill="#cbd5e1">Ropa de baño, o top y short pequeño.</text>
<text x="60" y="640" font-size="17" font-weight="700" fill="#ffffff">Hombre</text>
<text x="60" y="664" font-size="15" fill="#cbd5e1">Short pequeño y ligero, o bóxer.</text>
<text x="60" y="690" font-size="15" fill="#cbd5e1">Sin jeans ni buzo.</text>
<text x="60" y="738" font-size="14" fill="#fbbf24">Se deben ver bien tus piernas y tu cuerpo.</text>

